
<div class="schedules-container">

    <div class="page-heading">
      <div>
        <h1>Visit Schedules</h1>
        <p>Manage RM-wise monthly visit schedules</p>
      </div>
      
    </div>
  
    <!-- Filters -->

  
    <div class="filter-section">
        <div class="filter-group">
            <label>Search RM</label>
            <input type="text" placeholder="Enter RM name">
          </div>
      
  
      <div class="filter-group">
        <label>Select Month</label>
        <input type="month">
      </div>
  
      <div class="filter-group">
        <label>Select Date</label>
        <input type="date">
      </div>
  
      <div class="filter-group">
        <label>Select Team</label>
        <select>
          <option value="">All Teams</option>
          <option>Seller Team</option>
          <option>Non-Super Team</option>
          <option>Postpaid Team</option>
        </select>
      </div>
  
     
    </div>
  
    <!-- Summary Cards -->
    <div class="summary-grid">
  
      <div class="summary-card">
        <p>Total Schedules</p>
        <h2>0</h2>
      </div>
  
      <div class="summary-card">
        <p>Planned Visits</p>
        <h2>0</h2>
      </div>
  
      <div class="summary-card">
        <p>Completed</p>
        <h2>0</h2>
      </div>
  
      <div class="summary-card">
        <p>Pending</p>
        <h2>0</h2>
      </div>
  
    </div>
  
    <!-- Schedule Table -->
    <div class="table-container">
  
      <h2>RM Schedule Details</h2>
  
      <table>
        <thead>
          <tr>
            <th>RM Name</th>
            <th>Team</th>
            <th>Schedule Date</th>
            <th>Month</th>
            <th>Planned Visits</th>
            <th>Completed</th>
            <th>Pending</th>
            <th>Status</th>
          </tr>
        </thead>
  
        <tbody>
          <tr>
            <td colspan="8" class="empty-message">
              No schedule records available
            </td>
          </tr>
        </tbody>
      </table>
  
    </div>
  
  </div>
